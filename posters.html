<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Posters · My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"></noscript>
<style>
  :root{
    --ink: #f4f1ec; --ink-soft: #c8c1d4;
    --glass: rgba(20,18,28,0.45);
    --ring-radius: 380px;
    --poster-w: 220px;
    --poster-h: 310px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color:var(--ink); background:#0d0f1a;
  }
  .bg{
    position:fixed; inset:0; z-index:0;
    background:radial-gradient(ellipse at center, #1f1d34 0%, #0a0a14 70%);
  }
  .glow{
    position:fixed; z-index:0; border-radius:50%;
    pointer-events:none; will-change:transform;
  }
  .glow.g1{ width:520px; height:520px; top:-180px; left:-140px;
    background:radial-gradient(circle, rgba(255,160,200,0.18) 0%, rgba(255,160,200,0) 70%); }
  .glow.g2{ width:480px; height:480px; bottom:-160px; right:-140px;
    background:radial-gradient(circle, rgba(160,180,255,0.18) 0%, rgba(160,180,255,0) 70%); }
  .glow.g3{ width:420px; height:420px; top:38%; right:30%;
    background:radial-gradient(circle, rgba(255,210,150,0.10) 0%, rgba(255,210,150,0) 70%); }

  .ppt-header{
    position:fixed; top:0; left:0; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; background:var(--glass);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border-bottom:1px solid rgba(255,255,255,0.06);
    z-index:100;
  }
  .back-btn, .action-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:999px;
    font-size:15px; font-weight:700; text-decoration:none;
    border:none; cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .back-btn{
    background:rgba(255,255,255,0.08); color:#fff;
    border:1px solid rgba(255,255,255,0.12);
  }
  .back-btn:hover{ background:rgba(255,255,255,0.14); transform:translateY(-2px); }
  .header-title{
    font-family:'Playfair Display','Times New Roman',serif;
    font-size:clamp(22px, 3.2vw, 32px); font-weight:600; color:#fff;
    letter-spacing:0.5px;
  }

  .stage{
    position:fixed; inset:0; z-index:5;
    display:flex; align-items:center; justify-content:center;
    perspective:1400px; perspective-origin:center;
  }
  .ring{
    position:relative;
    width:var(--poster-w); height:var(--poster-h);
    transform-style:preserve-3d;
    transform:rotateY(0deg);
    will-change:transform;
  }
  .poster{
    position:absolute; left:0; top:0;
    width:var(--poster-w); height:var(--poster-h);
    border-radius:14px;
    background:#fff; padding:8px;
    box-shadow:0 24px 60px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.4);
    cursor:pointer; overflow:hidden;
    transform:rotateY(calc(51.428deg * var(--i))) translateZ(var(--ring-radius));
    backface-visibility:hidden;
    transition:transform .35s cubic-bezier(0.22,1,0.36,1), box-shadow .35s ease;
  }
  .poster img{
    width:100%; height:100%;
    object-fit:contain;
    display:block; border-radius:8px;
    pointer-events:none; user-select:none;
  }
  .poster::after{
    content:''; position:absolute; inset:0; border-radius:14px;
    background:linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 50%);
    pointer-events:none;
  }
  .poster:hover{
    box-shadow:0 30px 80px rgba(255,180,210,0.35), 0 6px 18px rgba(0,0,0,0.5);
  }

  .hint{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:60;
    display:flex; align-items:center; gap:14px;
    padding:10px 22px; border-radius:999px;
    background:rgba(20,18,28,0.55);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--ink-soft); font-size:14px; font-weight:600;
  }
  .hint .dot{
    width:8px; height:8px; border-radius:50%;
    background:#ffb3d6; box-shadow:0 0 12px #ffb3d6;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.4); opacity:.6; } }

  .viewer{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,8,16,0.86);
    backdrop-filter:blur(20px);
    opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility .3s ease;
    padding:32px;
  }
  .viewer.open{ opacity:1; visibility:visible; }
  .viewer-img-wrap{
    max-width:min(1100px, 92vw);
    max-height:90vh;
    display:flex; align-items:center; justify-content:center;
  }
  .viewer img{
    max-width:100%; max-height:90vh;
    width:auto; height:auto; object-fit:contain;
    border-radius:18px;
    box-shadow:0 30px 100px rgba(0,0,0,0.6);
    background:#fff; padding:14px;
  }
  .viewer-close{
    position:absolute; top:20px; right:24px;
    width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,0.1); color:#fff;
    border:1px solid rgba(255,255,255,0.15);
    font-size:24px; cursor:pointer;
    transition:transform .25s ease, background .25s ease;
  }
  .viewer-close:hover{ transform:rotate(90deg); background:rgba(255,255,255,0.18); }

  @media (max-width:780px){
    :root{
      --poster-w: 160px; --poster-h: 230px;
      --ring-radius: 260px;
    }
    .ppt-header{ padding:14px 16px; }
    .back-btn, .action-btn{ padding:10px 16px; font-size:14px; }
    .header-title{ display:none; }
    .hint{ font-size:12px; padding:8px 16px; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>

  <header class="ppt-header">
    <button class="back-btn" id="backBtn">← Back to Portfolio</button>
    <div class="header-title">Posters</div>
    <div style="width:140px"></div>
  </header>

  <div class="stage" id="stage">
    <div class="ring" id="ring">
      <div class="poster" data-src="images/posters/poster_01_ai8.png" style="--i:0">
        <img src="images/posters/poster_01_ai8.png" alt="Cozy Home" draggable="false">
      </div>
      <div class="poster" data-src="images/posters/poster_02_ai9.png" style="--i:1">
        <img src="images/posters/poster_02_ai9.png" alt="Cozy Home 2" draggable="false">
      </div>
      <div class="poster" data-src="images/posters/poster_03_gaoding1.webp" style="--i:2">
        <img src="images/posters/poster_03_gaoding1.webp" alt="Cozy Home Essentials" draggable="false">
      </div>
      <div class="poster" data-src="images/posters/poster_04_ai7.jpg" style="--i:3">
        <img src="images/posters/poster_04_ai7.jpg" alt="Be You Be Qoo" draggable="false">
      </div>
      <div class="poster" data-src="images/posters/poster_05_ai5.jpg" style="--i:4">
        <img src="images/posters/poster_05_ai5.jpg" alt="Spring Picnic" draggable="false">
      </div>
      <div class="poster" data-src="images/posters/poster_06_ai3.jpg" style="--i:5">
        <img src="images/posters/poster_06_ai3.jpg" alt="Qoo Apple" draggable="false">
      </div>
      <div class="poster" data-src="images/posters/poster_07_spring.jpg" style="--i:6">
        <img src="images/posters/poster_07_spring.jpg" alt="Spring Bloom" draggable="false">
      </div>
    </div>
  </div>

  <div class="hint">
    <span class="dot"></span>
    滚动旋转环 · 点击海报查看完整作品
  </div>

  <div class="viewer" id="viewer">
    <button class="viewer-close" id="viewerClose" aria-label="关闭">×</button>
    <div class="viewer-img-wrap">
      <img id="viewerImg" src="" alt="">
    </div>
  </div>

<script>
  const ring = document.getElementById('ring');
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');
  const viewerClose = document.getElementById('viewerClose');

  /* 用 RAF 持续驱动旋转：避免 CSS animation 与拖拽切换时重启造成的卡顿 */
  const BASE_SPEED = 22;    // 度/秒 ≈ 16s/圈（比之前更快）
  const BOOST_SPEED = 95;   // 度/秒 ≈ 3.8s/圈
  const BOOST_MS = 700;
  let angle = 0;            // 当前 rotateY 角度
  let speed = BASE_SPEED;
  let boostUntil = 0;
  let lastT = performance.now();

  function tick(now){
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (!dragging){
      if (now < boostUntil){
        speed = BOOST_SPEED;
      } else {
        /* 平滑回落到 base（每帧向 base 接近 ~12%），避免突变 */
        speed += (BASE_SPEED - speed) * Math.min(1, dt * 4);
      }
      angle += speed * dt;
      ring.style.transform = `rotateY(${angle}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* 滚动 / 触摸滑动 → 加速 + 短促保持 */
  function boost(){
    boostUntil = performance.now() + BOOST_MS;
    speed = BOOST_SPEED;
  }
  window.addEventListener('wheel', boost, { passive:true });
  let touchY = null, touchX = null;
  window.addEventListener('touchstart', e => {
    touchY = e.touches[0].clientY;
    touchX = e.touches[0].clientX;
  }, { passive:true });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (touchY === null) { touchY = t.clientY; touchX = t.clientX; return; }
    const dy = Math.abs(t.clientY - touchY);
    const dx = Math.abs(t.clientX - touchX);
    /* 横向滑动视为拖拽旋转，纵向滑动视为滚动加速 */
    if (dx > dy && dx > 2){
      angle += (t.clientX - touchX) * 0.5;
      ring.style.transform = `rotateY(${angle}deg)`;
    } else if (dy > 4){
      boost();
    }
    touchY = t.clientY; touchX = t.clientX;
  }, { passive:true });

  /* 鼠标拖拽手动旋转 */
  let dragging = false, lastX = 0;
  ring.addEventListener('mousedown', e => {
    dragging = true; lastX = e.clientX;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    angle += dx * 0.45;
    ring.style.transform = `rotateY(${angle}deg)`;
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    /* 松手后从当前角度继续 baseSpeed 旋转 */
    speed = BASE_SPEED;
    boostUntil = 0;
  });

  /* 点击海报查看完整图 */
  document.querySelectorAll('.poster').forEach(p => {
    p.addEventListener('click', () => {
      viewerImg.src = p.dataset.src;
      viewer.classList.add('open');
    });
  });
  function closeViewer(){
    viewer.classList.remove('open');
    viewerImg.src = '';
  }
  viewerClose.addEventListener('click', closeViewer);
  viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer();
  });

  /* 返回按钮 */
  document.getElementById('backBtn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else window.location.href = 'index.html#projects';
  });
</script>
</body>
</html>
