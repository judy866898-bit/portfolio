<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Videos · My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"></noscript>
<style>
  :root{
    --ink: #4a4458; --ink-soft: #7b7488;
    --glass: rgba(255,255,255,0.55);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    background:#f6f1f7;
  }
  .bg{
    position:fixed; inset:-20%; z-index:-2;
    background:linear-gradient(115deg, #F9CFE4 0%, #FAD9C6 22%, #E8D8F4 48%, #D2F2DE 72%, #D4EAF8 100%);
    background-size:300% 300%;
    animation:drift 24s ease-in-out infinite;
    will-change:background-position;
  }
  @keyframes drift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .blob{ position:fixed; z-index:-1; border-radius:50%; pointer-events:none; will-change:transform; }
  .b1{ width:520px; height:520px; top:-140px; left:-120px; background:radial-gradient(circle, rgba(255,214,236,0.55) 0%, rgba(255,214,236,0) 68%); animation:float1 18s ease-in-out infinite; }
  .b2{ width:460px; height:460px; bottom:-120px; right:-100px; background:radial-gradient(circle, rgba(214,234,255,0.55) 0%, rgba(214,234,255,0) 68%); animation:float2 22s ease-in-out infinite; }
  .b3{ width:380px; height:380px; top:38%; left:52%; background:radial-gradient(circle, rgba(219,242,226,0.5) 0%, rgba(219,242,226,0) 68%); animation:float1 20s ease-in-out infinite reverse; }
  @keyframes float1{ 0%,100%{ transform:translate3d(0,0,0); } 50%{ transform:translate3d(40px,30px,0); } }
  @keyframes float2{ 0%,100%{ transform:translate3d(0,0,0); } 50%{ transform:translate3d(-30px,-40px,0); } }

  .ppt-header{
    position:fixed; top:0; left:0; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border-bottom:1px solid rgba(255,255,255,0.7);
    z-index:100;
  }
  .back-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:999px;
    font-size:15px; font-weight:700; text-decoration:none;
    border:none; cursor:pointer;
    background:#fff; color:var(--ink);
    box-shadow:0 8px 20px rgba(150,110,160,0.15);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .back-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(150,110,160,0.22); }
  .header-title{
    font-family:'Playfair Display','Times New Roman',serif;
    font-size:clamp(20px, 3vw, 28px); font-weight:600; color:#2a2528;
    letter-spacing:0.5px;
  }

  .stage{ padding:80px 22px 70px; display:flex; flex-direction:column; align-items:center; }
  .vid-grid{
    width:min(1000px, 94vw);
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:24px;
  }
  .vid-card{
    background:#fff; border-radius:22px; overflow:hidden;
    cursor:pointer;
    box-shadow:0 16px 38px rgba(100,80,120,0.14);
    transition:transform .3s cubic-bezier(0.22,1,0.36,1), box-shadow .3s ease;
    display:flex; flex-direction:column;
    will-change:transform;
  }
  .vid-card:hover{ transform:translateY(-6px); box-shadow:0 24px 60px rgba(100,80,120,0.22); }
  .vid-card .thumb{
    position:relative;
    aspect-ratio:16 / 9;
    background:#f3edf5;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .vid-card .thumb img{
    max-width:100%; max-height:100%;
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    transition:transform .4s ease;
  }
  .vid-card:hover .thumb img{ transform:scale(1.04); }
  .vid-card .play{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .vid-card .play span{
    width:58px; height:58px; border-radius:50%;
    background:rgba(255,255,255,0.92);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 28px rgba(90,60,110,0.3);
    transition:transform .3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .vid-card:hover .play span{ transform:scale(1.12); }
  .vid-card .play span::before{
    content:''; display:block;
    width:0; height:0;
    margin-left:5px;
    border-left:17px solid #e97ab5;
    border-top:11px solid transparent;
    border-bottom:11px solid transparent;
  }
  .vid-card .body{
    padding:16px 22px 20px;
    display:flex; flex-direction:column; gap:8px;
  }
  .vid-card h3{
    font-family:'Fredoka',sans-serif;
    font-size:22px; font-weight:700; color:#2a2528; line-height:1.2;
    min-height:1.2em;
  }
  .vid-card p{ font-size:14px; color:#6b5e72; line-height:1.6; }
  .vid-card .meta{
    display:flex; align-items:center; justify-content:space-between; margin-top:2px;
  }
  .vid-card .tag{
    display:inline-block; padding:4px 12px; border-radius:999px;
    font-size:12px; font-weight:700;
    background:linear-gradient(135deg, #dff0ff, #bcdcff); color:#2c5687;
  }
  .vid-card .dur{
    font-size:12px; font-weight:700; color:#9a8aa3;
  }

  /* 播放器 */
  .player{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,8,16,0.88);
    backdrop-filter:blur(20px);
    opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility .3s ease;
    padding:32px;
  }
  .player.open{ opacity:1; visibility:visible; }
  .player video{
    max-width:100%; max-height:88vh;
    width:auto; height:auto;
    object-fit:contain;
    border-radius:14px;
    background:#000;
    box-shadow:0 30px 100px rgba(0,0,0,0.6);
  }
  .player-close{
    position:absolute; top:20px; right:24px;
    width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,0.12); color:#fff;
    border:1px solid rgba(255,255,255,0.18);
    font-size:24px; cursor:pointer;
    transition:transform .25s ease, background .25s ease;
  }
  .player-close:hover{ transform:rotate(90deg); background:rgba(255,255,255,0.22); }

  @media (max-width:780px){
    .ppt-header{ padding:14px 16px; }
    .back-btn{ padding:10px 16px; font-size:14px; }
    .header-title{ display:none; }
    .stage{ padding:90px 16px 60px; }
    .vid-grid{ grid-template-columns:1fr; gap:18px; }
    .player{ padding:16px; }
    .player video{ max-height:78vh; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <header class="ppt-header">
    <button class="back-btn" id="backBtn">← Back to Portfolio</button>
    <div class="header-title">Videos</div>
    <div style="width:140px"></div>
  </header>

  <main class="stage" id="stage">
    <div class="vid-grid" id="grid">
      <!-- 卡片由 JS 注入 -->
    </div>
  </main>

  <div class="player" id="player">
    <button class="player-close" id="playerClose" aria-label="关闭">×</button>
    <video id="playerVideo" controls loop playsinline preload="none"></video>
  </div>

<script>
  const clips = [
    {
      title: '创意广告短片',
      src: 'videos/video_01_ad.mp4',
      cover: 'images/videos/cover_01_ad.jpg',
      tag: '竖版 · 创意',
      dur: '0:05'
    },
    {
      title: '皮克斯风格 · 反差',
      src: 'videos/video_02_pixar.mp4',
      cover: 'images/videos/cover_02_pixar.jpg',
      tag: '横版 · 动画',
      dur: '0:08'
    },
    {
      title: '产品创意展示',
      src: 'videos/video_03_product.mp4',
      cover: 'images/videos/cover_03_product.jpg',
      tag: '竖版 · 产品',
      dur: '0:05'
    },
    {
      title: '粘土定格动画',
      src: 'videos/video_04_short.mp4',
      cover: 'images/videos/cover_04_short.jpg',
      tag: '横版 · 动画',
      dur: '0:07'
    }
  ];

  const grid = document.getElementById('grid');
  const player = document.getElementById('player');
  const pv = document.getElementById('playerVideo');
  const playerClose = document.getElementById('playerClose');
  const frag = document.createDocumentFragment();

  clips.forEach(c => {
    const card = document.createElement('div');
    card.className = 'vid-card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = c.cover; img.alt = c.title; img.loading = 'lazy'; img.draggable = false;
    const play = document.createElement('div');
    play.className = 'play';
    play.appendChild(document.createElement('span'));
    thumb.appendChild(img);
    thumb.appendChild(play);

    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `
      <h3>${c.title}</h3>
      <div class="meta">
        <span class="tag">${c.tag}</span>
        <span class="dur">${c.dur}</span>
      </div>`;

    card.appendChild(thumb);
    card.appendChild(body);
    frag.appendChild(card);

    card.addEventListener('click', () => {
      pv.src = c.src;
      player.classList.add('open');
      const p = pv.play();
      if (p && p.catch) p.catch(() => {});
    });
  });
  grid.appendChild(frag);

  function closePlayer(){
    player.classList.remove('open');
    pv.pause();
    pv.removeAttribute('src');
    pv.load();
  }
  playerClose.addEventListener('click', closePlayer);
  player.addEventListener('click', e => { if (e.target === player) closePlayer(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && player.classList.contains('open')) closePlayer();
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else window.location.href = 'index.html#projects';
  });
</script>
</body>
</html>
