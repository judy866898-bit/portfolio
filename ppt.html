<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPT · 运营理解 · My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"></noscript>
<style>
  :root{
    --candy-pink: #FBD3E9; --candy-peach: #FCE3C8;
    --candy-lav: #E7DBF4; --candy-mint: #D6F0E4; --candy-sky: #D6E8F4;
    --ink: #4a4458; --ink-soft: #7b7488; --glass: rgba(255,255,255,0.55);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    background:#f6f1f7;
  }
  .bg{
    position:fixed; inset:-20%; z-index:-2;
    background:linear-gradient(115deg, #F9CFE4 0%, #FAD9C6 22%, #E8D8F4 48%, #D2F2DE 72%, #D4EAF8 100%);
    background-size:300% 300%;
    animation:drift 24s ease-in-out infinite;
    will-change:background-position;
  }
  @keyframes drift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .blob{
    position:fixed; z-index:-1; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,214,236,0.55) 0%, rgba(255,214,236,0) 68%);
    will-change:transform;
  }
  .b1{ width:520px; height:520px; top:-140px; left:-120px; animation:float1 18s ease-in-out infinite; }
  .b2{ width:460px; height:460px; bottom:-120px; right:-100px; background:radial-gradient(circle, rgba(214,234,255,0.55) 0%, rgba(214,234,255,0) 68%); animation:float2 22s ease-in-out infinite; }
  .b3{ width:380px; height:380px; top:38%; left:52%; background:radial-gradient(circle, rgba(219,242,226,0.5) 0%, rgba(219,242,226,0) 68%); animation:float1 20s ease-in-out infinite reverse; }
  @keyframes float1{ 0%,100%{ transform:translate3d(0,0,0); } 50%{ transform:translate3d(40px,30px,0); } }
  @keyframes float2{ 0%,100%{ transform:translate3d(0,0,0); } 50%{ transform:translate3d(-30px,-40px,0); } }

  /* 顶部固定导航 */
  .ppt-header{
    position:fixed; top:0; left:0; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border-bottom:1px solid rgba(255,255,255,0.7);
    z-index:100;
  }
  .back-btn, .download-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:999px;
    font-size:15px; font-weight:700; text-decoration:none;
    border:none; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;
  }
  .back-btn{
    background:#fff; color:var(--ink);
    box-shadow:0 8px 20px rgba(150,110,160,0.15);
  }
  .back-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(150,110,160,0.22); }
  .download-btn{
    background:linear-gradient(135deg,#f7a8c8,#e97ab5); color:#fff;
    box-shadow:0 10px 22px rgba(230,110,160,0.28);
  }
  .download-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 28px rgba(230,110,160,0.36); }
  .header-title{
    font-family:'Playfair Display','Times New Roman',serif;
    font-size:clamp(22px, 3.2vw, 32px); font-weight:600; color:#2a2528;
  }

  /* 主体：全屏幻灯片流 */
  .ppt-stage{
    padding:92px 18px 90px;
    display:flex; flex-direction:column; align-items:center; gap:34px;
  }
  .slide{
    width:100%; max-width:min(1200px, 92vw); display:block;
    border-radius:18px; border:4px solid #fff;
    background:#fff;
    box-shadow:0 24px 70px rgba(100,80,120,0.18);
    opacity:0; transform:translateY(24px);
    transition:opacity .6s ease, transform .6s cubic-bezier(0.22,1,0.36,1);
  }
  .slide.visible{ opacity:1; transform:translateY(0); }
  .slide img{
    width:100%; height:auto; display:block; border-radius:14px;
  }

  .bottom-actions{
    margin-top:24px; display:flex; justify-content:center;
  }

  @media (max-width:780px){
    .ppt-header{ padding:14px 16px; }
    .back-btn, .download-btn{ padding:10px 16px; font-size:14px; }
    .header-title{ display:none; }
    .ppt-stage{ padding:82px 14px 70px; gap:22px; }
    .slide{ border-width:3px; border-radius:14px; }
    .slide img{ border-radius:10px; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <header class="ppt-header">
    <button class="back-btn" id="backBtn" aria-label="返回作品集">
      ← Back to Portfolio
    </button>
    <div class="header-title">PPT · 运营理解</div>
    <a class="download-btn" href="downloads/运营理解.pptx" download>
      📥 下载 PPT
    </a>
  </header>

  <main class="ppt-stage" id="stage">
    <!-- 幻灯片由 JS 注入 -->
  </main>

  <div class="bottom-actions">
    <a class="download-btn" href="downloads/运营理解.pptx" download>📥 下载完整 PPT</a>
  </div>

<script>
  const totalSlides = 27;
  const stage = document.getElementById('stage');

  // 注入全部幻灯片
  for (let i = 1; i <= totalSlides; i++) {
    const div = document.createElement('div');
    div.className = 'slide';
    div.innerHTML = `<img src="images/ppt/slide_${i}.png" alt="PPT 第 ${i} 页" loading="lazy">`;
    stage.appendChild(div);
  }

  // 返回按钮：优先返回上一页，否则跳回主页 Projects
  document.getElementById('backBtn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else window.location.href = 'index.html#projects';
  });

  // 滚动淡入
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add('visible'); });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  document.querySelectorAll('.slide').forEach(s => observer.observe(s));
</script>
</body>
</html>
